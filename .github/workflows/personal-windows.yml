name: Personal Blender - Windows

on:
  workflow_dispatch:
  push:
    branches: [personal]
    paths-ignore:
      - '**/*.md'

permissions:
  contents: read

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 350
    defaults:
      run:
        shell: pwsh
    env:
      GIT_LFS_SKIP_SMUDGE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: false

      - name: Build and smoke test
        run: |
          & ./tools/local-build/Build-Blender.ps1 -NoLaunch
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validate world transform snapping
        run: |
          & ./.local-build/build-full/bin/Release/blender.exe --background --factory-startup --python-exit-code 1 --python ./tests/python/view3d_cursor_world_snap.py 2>&1 | Tee-Object -FilePath .local-build/logs/world-snap-tests.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package portable ZIP
        run: ./tools/local-build/Package-Blender.ps1 -Format ZIP

      - name: Upload portable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: blender-windows-portable-${{ github.run_number }}
          path: |
            .local-build/packages/*.zip
            .local-build/packages/*.zip.sha256
          include-hidden-files: true
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Package MSI installer
        run: ./tools/local-build/Package-Blender.ps1 -Format MSI

      - name: Upload MSI installer
        uses: actions/upload-artifact@v4
        with:
          name: blender-windows-installer-${{ github.run_number }}
          path: |
            .local-build/packages/*.msi
            .local-build/packages/*.msi.sha256
          include-hidden-files: true
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-build-logs-${{ github.run_number }}
          include-hidden-files: true
          path: |
            .local-build/packages/wix-diagnostics/*.log
            .local-build/logs/*.log
            .local-build/build-full/Build.log
            .local-build/build-full/CMakeFiles/CMakeConfigureLog.yaml
          retention-days: 7
